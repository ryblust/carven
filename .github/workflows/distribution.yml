name: Distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} / Package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Linux
            os: ubuntu-26.04
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Carven
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install patch-compatible Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - name: Install LLVM on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Install LLVM on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 23 all
          sudo apt-get install -y patchelf
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
      - name: Install LLVM-MinGW on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LLVM_MINGW_RELEASE: '20261020'
          LLVM_MINGW_SHA256: fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd
        run: |
          $archiveName = "llvm-mingw-$env:LLVM_MINGW_RELEASE-ucrt-x86_64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_RELEASE/$archiveName" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW archive checksum mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $llvmRoot = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_RELEASE-ucrt-x86_64"
          "$llvmRoot/bin" >> $env:GITHUB_PATH
          "$llvmRoot/x86_64-w64-mingw32/bin" >> $env:GITHUB_PATH
          "LLVM_MINGW_ROOT=$llvmRoot" >> $env:GITHUB_ENV
          "AR=llvm-ar" >> $env:GITHUB_ENV
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          package_json_file: editors/vscode/package.json
      - name: Build installed toolchain
        if: runner.os != 'Windows'
        run: |
          ./xmakew f -y -m release --sanitizers=n
          ./xmakew build
          ./xmakew build -g toolchain
          ./xmakew install -o "$PWD/build/toolchain" -g toolchain
      - name: Build installed toolchain on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\xmakew.ps1 f -y -m release --sanitizers=n
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\xmakew.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\xmakew.ps1 build -g toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\xmakew.ps1 install -o "$PWD/build/toolchain" -g toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and validate
        run: |
          pnpm --dir editors/vscode install --frozen-lockfile
          pnpm --dir editors/vscode run format-check
          pnpm --dir editors/vscode run check:tests
          node tools/release/package.mjs "$PWD/build/toolchain"
          pnpm --dir editors/vscode run package
          node editors/vscode/tests/installation.ts
      - name: Test editor contracts
        env:
          CARVEN_LSP: ${{ github.workspace }}/build/toolchain/bin/carven-lsp${{ runner.os == 'Windows' && '.exe' || '' }}
          CARVEN_TEST_COMPILER: ${{ github.workspace }}/build/toolchain/bin/carven${{ runner.os == 'Windows' && '.exe' || '' }}
          CARVEN_TEST_CRAFTS: ${{ github.workspace }}/build/toolchain/crafts
        run: pnpm --dir editors/vscode test
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: carven-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/packages/*.tar.gz
            build/packages/*.sha256
            build/packages/*.vsix
            install.sh
            install.ps1
