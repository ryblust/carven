name: Distribution

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  collect:
    name: Collect validated CI artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download validated CI artifacts
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No successful CI run for the selected branch or tag commit."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'carven-*' --dir artifacts

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: carven-distribution
          if-no-files-found: error
          path: artifacts/
