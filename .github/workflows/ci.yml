name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: ${{ matrix.platform }} / LLVM / Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macOS
          - os: ubuntu-26.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: carven
    env:
      CARVEN_XMAKE_REPO_DIR: ${{ github.workspace }}/carven-xmake-repo

    steps:
      - name: Check out Carven
        uses: actions/checkout@v7
        with:
          path: carven
          persist-credentials: false

      - name: Check out build rules
        uses: actions/checkout@v7
        with:
          repository: ryblust/carven-xmake-repo
          path: carven-xmake-repo
          persist-credentials: false

      - name: Install official Xmake
        if: runner.os == 'Linux'
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install toolchain on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm xmake
          llvm_root="$(brew --prefix llvm)"
          echo "$llvm_root/bin" >> "$GITHUB_PATH"

      - name: Install LLVM on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 23 all
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          ./xmakew --version
          clang --version
          clang-tidy --version
          clang-format --version

      - name: Configure Release
        run: ./xmakew f -y -m release

      - name: Show detected toolchain
        run: ./xmakew show -t carven

      - name: Build compiler
        run: ./xmakew build -y

      - name: Test all groups
        run: ./xmakew test

      - name: Check formatting
        if: runner.os == 'macOS'
        run: ./xmakew format-check

      - name: Clang-tidy
        run: |
          if ! ./xmakew check -vD clang.tidy; then
            # Xmake generates this database in quiet mode before starting tidy.
            # Repeat visibly on failure so setup errors are not lost.
            ./xmakew project -vD -k compile_commands --lsp=clangd build/clang-tidy-diagnostics
            exit 1
          fi

  windows:
    name: Windows / LLVM-MinGW / Release
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: carven
    env:
      CARVEN_XMAKE_REPO_DIR: ${{ github.workspace }}/carven-xmake-repo
      LLVM_MINGW_RELEASE: '20260922'
      LLVM_MINGW_SHA256: e3ad77d117a4bea19a7a3b333341824d79a5a371004a10e25b8504e7b3047666

    steps:
      - name: Check out Carven
        uses: actions/checkout@v7
        with:
          path: carven
          persist-credentials: false

      - name: Check out build rules
        uses: actions/checkout@v7
        with:
          repository: ryblust/carven-xmake-repo
          path: carven-xmake-repo
          persist-credentials: false

      - name: Install patch-compatible Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'

      - name: Install LLVM-MinGW
        run: |
          $archiveName = "llvm-mingw-$env:LLVM_MINGW_RELEASE-ucrt-x86_64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_RELEASE/$archiveName"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW archive checksum mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $llvmRoot = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_RELEASE-ucrt-x86_64"
          "LLVM_MINGW_ROOT=$llvmRoot" >> $env:GITHUB_ENV
          "CXX=$llvmRoot/bin/clang++.exe" >> $env:GITHUB_ENV
          "$llvmRoot/bin" >> $env:GITHUB_PATH

      - name: Show toolchain versions
        run: |
          .\xmakew.ps1 lua -c 'print("Xmake " .. tostring(xmake.version()))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang++ --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-scan-deps --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-tidy --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify patched Xmake module rules
        run: |
          $check = @'
          local root = os.programdir()
          print("Xmake runtime: " .. root)
          assert(os.isfile(path.join(root, "modules/private/action/build/content_depend.lua")), "Carven content-dependency adapter is missing")
          local rules = io.readfile(path.join(root, "rules/c++/modules/xmake.lua"))
          assert(rules:find('before_build_files("builder.build_module_pipeline"', 1, true), "Carven module pipeline is not registered")
          print("Carven module-pipeline overlay verified")
          '@
          .\xmakew.ps1 lua -c $check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Release
        run: |
          .\xmakew.ps1 f -y -m release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show detected toolchain
        run: .\xmakew.ps1 show -t carven

      - name: Build compiler
        run: .\xmakew.ps1 build -y

      - name: Test all groups
        run: .\xmakew.ps1 test

      - name: Verify fixture runtime linkage
        run: |
          foreach ($fixture in @("exception-boundary", "allocation-failure")) {
            foreach ($suffix in @("", "-cxx23")) {
              $target = "carven-test-interop-$fixture$suffix"
              $imports = llvm-readobj --coff-imports "build/windows/x64/release/$target.exe"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $shared = [bool]($imports -match '(?i)Name: libc\+\+(abi)?\.dll')
              $expectedShared = $fixture -eq "exception-boundary"
              if ($shared -ne $expectedShared) {
                throw "$target has unexpected libc++ linkage (shared=$shared, expected=$expectedShared)"
              }
              Write-Output "$target libc++ linkage verified (shared=$shared)"
            }
          }

      - name: Clang-tidy
        run: .\xmakew.ps1 check clang.tidy

  sanitizers:
    name: Linux / LLVM / ASan + UBSan
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: carven
    env:
      CARVEN_XMAKE_REPO_DIR: ${{ github.workspace }}/carven-xmake-repo
      # Exit directly so expected-SIGABRT fixtures cannot swallow ASan failures.
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1:abort_on_error=0:exitcode=86
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      # Shared by Xmake targets and the native compiler invoked by `carven run`.
      SANITIZER_FLAGS: >-
        -O1 -g -fno-omit-frame-pointer -fno-optimize-sibling-calls
        -fsanitize-address-use-after-scope -fno-sanitize-recover=all

    steps:
      - name: Check out Carven
        uses: actions/checkout@v7
        with:
          path: carven
          persist-credentials: false

      - name: Check out build rules
        uses: actions/checkout@v7
        with:
          repository: ryblust/carven-xmake-repo
          path: carven-xmake-repo
          persist-credentials: false

      - name: Install official Xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install LLVM
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 23 all
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          ./xmakew --version
          clang --version
          llvm-symbolizer --version

      - name: Configure sanitizers
        run: |
          # Debug keeps symbols and avoids the project's Release-only LTO policy.
          ./xmakew f -y -m debug \
            --policies=build.sanitizer.address,build.sanitizer.undefined \
            --cxflags="$SANITIZER_FLAGS"

      - name: Configure native execution checks
        run: |
          # `carven run` invokes CXX directly, outside Xmake's target flags.
          cat > "$RUNNER_TEMP/carven-sanitizer-clang++" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          read -r -a flags <<< "$SANITIZER_FLAGS"
          exec clang++ \
            -fsanitize=address,undefined "${flags[@]}" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/carven-sanitizer-clang++"
          echo "CXX=$RUNNER_TEMP/carven-sanitizer-clang++" >> "$GITHUB_ENV"

      - name: Show detected toolchain
        run: ./xmakew show -t carven

      - name: Build compiler
        run: ./xmakew build -y

      - name: Test all groups
        run: ./xmakew test
