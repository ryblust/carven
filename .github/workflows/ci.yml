name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Debug
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: carven
    env:
      CARVEN_XMAKE_REPO_DIR: ${{ github.workspace }}/carven-xmake-repo

    steps:
      - name: Check out Carven
        uses: actions/checkout@v7
        with:
          path: carven
          persist-credentials: false

      - name: Check out build rules
        uses: actions/checkout@v7
        with:
          repository: ryblust/carven-xmake-repo
          path: carven-xmake-repo
          persist-credentials: false

      - name: Install official Xmake
        if: runner.os == 'Linux'
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install toolchain on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm xmake
          llvm_root="$(brew --prefix llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          echo "$llvm_root/bin" >> "$GITHUB_PATH"

      - name: Install LLVM on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 23 all
          echo "LLVM_ROOT=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          xmake --version
          clang --version
          clang-format --version

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: |
          xmake f -y -m debug --sdk="$LLVM_ROOT" --target_minver=26.0 \
            --ldflags="-L$LLVM_ROOT/lib/c++ -Wl,-rpath,$LLVM_ROOT/lib/c++"

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: xmake f -y -m debug --sdk="$LLVM_ROOT" --runtimes=c++_shared --syslinks=c++abi

      - name: Build compiler
        run: xmake build -y

      - name: Test all groups
        run: xmake test

      - name: Clang-tidy
        run: xmake check clang.tidy

      - name: Check formatting
        if: runner.os == 'macOS'
        run: xmake format-check
