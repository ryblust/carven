name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} / ${{ matrix.mode == 'release' && 'Release' || 'ASan + UBSan' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, Linux, Windows]
        mode: [release, debug]
        include:
          - platform: macOS
            os: macos-latest
            shell: bash
            xmake: ./xmakew
          - platform: Linux
            os: ubuntu-26.04
            shell: bash
            xmake: ./xmakew
          - platform: Windows
            os: windows-latest
            shell: pwsh
            xmake: .\xmakew.ps1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # LeakSanitizer is unsupported on Windows.
      ASAN_OPTIONS: ${{ matrix.mode == 'debug' && format('detect_leaks={0}:detect_stack_use_after_return=1:strict_string_checks=1', matrix.platform == 'Windows' && '0' || '1') || '' }}
      UBSAN_OPTIONS: ${{ matrix.mode == 'debug' && 'print_stacktrace=1' || '' }}

    steps:
      - name: Check out Carven
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install patch-compatible Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'

      - name: Install LLVM on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install LLVM on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 23 all
          sudo apt-get install -y patchelf
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"

      - name: Install LLVM-MinGW on Windows
        if: runner.os == 'Windows'
        env:
          LLVM_MINGW_RELEASE: '20261020'
          LLVM_MINGW_SHA256: fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd
        run: |
          $archiveName = "llvm-mingw-$env:LLVM_MINGW_RELEASE-ucrt-x86_64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_RELEASE/$archiveName"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW archive checksum mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $llvmRoot = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_RELEASE-ucrt-x86_64"
          "$llvmRoot/bin" >> $env:GITHUB_PATH
          "$llvmRoot/x86_64-w64-mingw32/bin" >> $env:GITHUB_PATH
          "LLVM_MINGW_ROOT=$llvmRoot" >> $env:GITHUB_ENV
          "AR=llvm-ar" >> $env:GITHUB_ENV

      - name: Show toolchain versions
        if: runner.os != 'Windows'
        run: |
          ./xmakew --version
          clang --version
          llvm-symbolizer --version
          clang-format --version

      - name: Show toolchain versions on Windows
        if: runner.os == 'Windows'
        run: |
          .\xmakew.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang++ --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-scan-deps --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure build
        run: ${{ matrix.xmake }} f -y -m ${{ matrix.mode }} --sanitizers=${{ matrix.mode == 'debug' && 'y' || 'n' }}

      - name: Show detected toolchain
        run: ${{ matrix.xmake }} show -t carven

      - name: Build compiler
        run: ${{ matrix.xmake }} build -y

      - name: Test all groups
        run: ${{ matrix.xmake }} test

      - name: Build toolchain
        if: matrix.mode == 'release'
        run: ${{ matrix.xmake }} build -g toolchain

      - name: Install toolchain
        if: matrix.mode == 'release'
        run: ${{ matrix.xmake }} install -o "${{ github.workspace }}/build/toolchain" -g toolchain

      - name: Check formatting
        if: matrix.mode == 'release' && runner.os == 'macOS'
        run: ./xmakew format-check

      - name: Set up Node
        if: matrix.mode == 'release'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pnpm
        if: matrix.mode == 'release'
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          package_json_file: editors/vscode/package.json

      - name: Install editor test dependencies
        if: matrix.mode == 'release'
        run: pnpm --dir editors/vscode install --frozen-lockfile

      - name: Check editor sources
        if: matrix.mode == 'release' && runner.os == 'macOS'
        run: |
          pnpm --dir editors/vscode run format-check
          pnpm --dir editors/vscode run check:tests

      - name: Package toolchain
        if: matrix.mode == 'release'
        run: node tools/release/package.mjs "${{ github.workspace }}/build/toolchain"

      - name: Check installed package
        if: matrix.mode == 'release'
        run: node tools/release/check.mjs

      - name: Test editor contracts
        if: matrix.mode == 'release'
        env:
          CARVEN_LSP: ${{ github.workspace }}/build/installed/bin/carven-lsp${{ runner.os == 'Windows' && '.exe' || '' }}
          CARVEN_TEST_COMPILER: ${{ github.workspace }}/build/installed/bin/carven${{ runner.os == 'Windows' && '.exe' || '' }}
          CARVEN_TEST_CRAFTS: ${{ github.workspace }}/build/installed/crafts
        run: pnpm --dir editors/vscode test

      - name: Upload toolchain
        if: matrix.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: carven-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            build/packages/*.tar.gz
            build/packages/*.sha256

      - name: Package VS Code extension
        if: matrix.mode == 'release' && runner.os == 'macOS'
        run: pnpm --dir editors/vscode run package

      - name: Upload editor and installers
        if: matrix.mode == 'release' && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: carven-editor-and-installers
          if-no-files-found: error
          path: |
            build/packages/*.vsix
            install.sh
            install.ps1
